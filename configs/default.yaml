# Arachne Configuration
version: "0.1.0"

# Tor Configuration
tor:
  socks_port: 9050
  control_port: 9051
  control_password: "arachne_tor_password"
  circuit_count: 10
  circuit_lifetime_minutes: 10
  max_requests_per_circuit: 100
  entry_guards: 3
  
# Discovery Configuration
discovery:
  max_depth: 3
  max_pages_per_site: 50
  concurrent_requests: 5
  request_delay_ms:
    min: 1000
    max: 5000
  user_agents_file: "configs/user_agents.txt"
  seeds_file: "configs/seeds/initial.txt"
  
  # Social listening
  telegram:
    enabled: false
    api_id: ""
    api_hash: ""
    channels: []
  
  irc:
    enabled: false
    servers:
      - host: "irc.example.com"
        port: 6667
        nickname: "arachne_bot"
    channels: []
  
  twitter:
    enabled: false
    bearer_token: ""
    search_terms: []
  
  # Directory sync
  directories:
    - "https://onion.ly"
    - "https://onion.cab"
  
  feeds:
    - "https://example.com/feed.rss"
  
# Classification Configuration
classification:
  confidence_threshold: 0.7
  illegal_patterns_file: "configs/illegal_patterns.txt"
  known_honeypots_file: "configs/known_honeypots.txt"
  
# Safety Configuration
safety:
  max_content_size_mb: 10
  image_filtering: true
  illegal_content_filter: strict
  air_gap_mode: true
  
# Database Configuration
database:
  postgres:
    host: "localhost"
    port: 5432
    name: "arachne"
    user: "arachne"
    password: ""  # Set via environment variable
  redis:
    host: "localhost"
    port: 6379
    db: 0
    
# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  debug: false
  cors_origins: ["http://localhost:3000", "http://localhost:8000"]

# Scheduler Configuration
scheduler:
  workers: 3
  discovery_interval: 3600  # 1 hour
  classification_batch_size: 10
  maintenance_hour: 3  # 3 AM

# Monitoring Configuration
monitoring:
  health_check_interval: 60
  alerting:
    enabled: false
    email:
      smtp_host: ""
      smtp_port: 587
      smtp_user: ""
      smtp_password: ""
      to_emails: []
    slack:
      webhook_url: ""

# Dashboard Configuration
dashboard:
  enabled: true
  port: 3000
  auto_open: true
